<!-- FORMULARIO CONTACTO -->
<main class="container my-5">
    <section class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="mb-3 text-center">Contacto</h1>
            <p class="text-center mb-4">
                Para contactarte con nosotros, puedes rellenar este formulario.
            </p>

            <form method="post">
                <label class="form-label" for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" class="form-control mb-3">

                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control mb-3">

                <label class="form-label" for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" class="form-control mb-3">

                <label class="form-label" for="motivo">Motivo de tu contacto</label>
                <select id="motivo" name="motivo" class="form-select mb-3" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="consulta">Consultar sobre un producto</option>
                    <option value="felicitaciones">Felicitaciones</option>
                    <option value="trabajo">Trabajar con nosotros</option>
                </select>

                <label class="form-label" for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" class="form-control mb-4" rows="4"></textarea>

                <button class="btn btn-dark w-100">Enviar</button>
            </form>
        </div>
    </section>
</main>
