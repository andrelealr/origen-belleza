<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSS link -->

<!-- BOOTSTRAP link -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Origen Belleza | Productos</title>
</head>
<body>
</head>
<body> 

<!-- ENCABEZADO -->
    <header class="bg-dark">
        <nav class="menu container d-flex align-items-center justify-content-between">
            <img src="../assets/img/logo.png" alt="Logo Origen Belleza" class="logo">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../pages/productos.html">Productos</a></li>
                <li><a href="../pages/contacto.html">Contacto</a></li>
            </ul>
            
         <a href="#" class="btn-login">Iniciar Sesión</a>
         <a href="#" class="btn-singup">Registro</a>
        </nav>
    </header>

<!-- FORMULARIO CONTACTO -->
    <main class="container my-4">
        <section>
            <h1>Contacto</h1>
            <p class="text-contacto">Para contactarte con nosotros, puedes rellenar este formulario.</p>
            <div>
                <form action="" method="post" class="mt-3">

                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control mb-3">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control mb-3">

                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" class="form-control mb-3">

                    <label for="motivo">Motivo de tu contacto</label>
                    <select name="" id="motivo" name="motivo" required class="form-control mb-3">
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="consulta">Consultar sobre un producto</option>
                        <option value="felicitaciones">Felicitaciones</option>
                        <option value="trabajo">Trabajar con nosotros</option>
                    </select>

                    <label for="mensaje">¿Quieres agregar algo mas?. Escribe aquí tu mensaje</label>
                    <textarea name="mensaje" id="mensaje" class="form-control mb-3"></textarea>

                    <button class="btn btn-dark">Enviar</button>
                </form>
            </div>
        </section>
    </main>

<!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-3 mt-4">
        <div>
            <img src="../assets/img/facebook.png" alt="Facebook" class="redes-logo">
            <img src="../assets/img/instagram.png" alt="instagram" class="redes-logo">
            <p class="text-footer">© 2025 Origen Belleza | Todos los derechos reservados</p>
        </div>
    </footer>
    

<!-- Scripts de Bootstrap -->   
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
